<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown to Saturday</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#0b1020;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
h1{font-size:clamp(1.4rem,5vw,2.2rem);margin-bottom:6px}#now{color:#94a3b8;font-size:.9rem;margin-bottom:4px}#target{color:#fbbf24;font-size:.95rem;margin-bottom:16px}
#timer{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.cell{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px 10px;min-width:78px}.cell b{display:block;font-size:clamp(1.8rem,8vw,3rem);font-variant-numeric:tabular-nums;color:#7dd3fc}.cell span{font-size:.75rem;letter-spacing:2px;color:#94a3b8}
#msg{font-size:clamp(2rem,9vw,4rem);margin:16px 0;display:none;animation:pop .6s ease}@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.row{display:flex;gap:10px;margin-top:18px}button{background:#7c3aed;border:none;color:#fff;border-radius:999px;padding:12px 22px;font-size:1rem;cursor:pointer}button.ghost{background:#334155}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<h1>⏳ Countdown to Saturday</h1>
<div id="now"></div><div id="target"></div>
<div id="timer">
<div class="cell"><b id="d">–</b><span>DAYS</span></div>
<div class="cell"><b id="h">–</b><span>HOURS</span></div>
<div class="cell"><b id="m">–</b><span>MINS</span></div>
<div class="cell"><b id="s">–</b><span>SECS</span></div>
</div>
<div id="msg">🎉 It's Saturday! 🎉</div>
<div class="row"><button id="mute" class="ghost">🔊 Sound: on</button></div>
<script>
let muted=false,celebrating=false;
const $=id=>document.getElementById(id);
function nextSat(){const n=new Date(),d=new Date(n);d.setHours(0,0,0,0);let add=(6-d.getDay()+7)%7;if(add===0&&n-d>=864e5)add=7;d.setDate(d.getDate()+add);return d;}
let target=nextSat();
function fanfare(){if(muted)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume();[523,659,784,1047,784,1047].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;const t=a.currentTime+i*0.15;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g).connect(a.destination);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(e){}};o.start(t);o.stop(t+.45);});setTimeout(()=>{try{a.close();}catch(e){}},1500);}catch(e){}}
const cv=$('fx'),ctx=cv.getContext('2d');let P=[],raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight;}addEventListener('resize',size);size();
const COLORS=['#f43f5e','#f59e0b','#10b981','#3b82f6','#a855f7','#facc15','#fff'];
function burst(x,y,n=80,spread=10){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*spread;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.15,s:4+Math.random()*6,c:COLORS[(Math.random()*COLORS.length)|0],r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,l:1,decay:.004+Math.random()*.008});}}
function rain(n=8){for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,s:5+Math.random()*6,c:COLORS[(Math.random()*COLORS.length)|0],r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,l:1,decay:.003});}
function loop(){ctx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<cv.height+30);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.l-=p.decay;ctx.save();ctx.globalAlpha=Math.max(p.l,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});if(P.length||celebrating)raf=requestAnimationFrame(loop);else{cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,cv.width,cv.height);}}
function boom(){burst(cv.width*0.2,cv.height*0.3,120);burst(cv.width*0.8,cv.height*0.3,120);burst(cv.width*0.5,cv.height*0.4,150,14);if(!raf)raf=requestAnimationFrame(loop);}
function celebrate(){if(celebrating)return;celebrating=true;$('msg').style.display='block';fanfare();boom();const iv=setInterval(()=>{rain(10);boom();},900);const rainIv=setInterval(()=>rain(6),120);setTimeout(()=>{clearInterval(iv);clearInterval(rainIv);setTimeout(()=>{celebrating=false;$('msg').style.display='none';target=nextSat();if(target-new Date()<=0)target=new Date(target.getTime()+7*864e5);tick();},2000);},10000);}
function tick(){const n=new Date();$('now').textContent=n.toLocaleString([],{weekday:'long',hour:'2-digit',minute:'2-digit',second:'2-digit'});$('target').textContent='Next Saturday: '+target.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});let ms=target-n;if(ms<=0){if(!celebrating)celebrate();return;}$('d').textContent=Math.floor(ms/864e5);$('h').textContent=String(Math.floor(ms/36e5)%24).padStart(2,'0');$('m').textContent=String(Math.floor(ms/6e4)%60).padStart(2,'0');$('s').textContent=String(Math.floor(ms/1e3)%60).padStart(2,'0');}
$('mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇 Sound: off':'🔊 Sound: on';};
setInterval(tick,1000);tick();
</script>
</body>
</html>
